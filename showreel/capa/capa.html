<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa Reels</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  /* Capa limpa: o título é o protagonista. Tudo que importa fica no recorte 3:4 do grid (y 240–1680). */
  :root { --noite:#0A0A26; --laranja:#EF4F24; --sub:#C9C3F0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--noite); }
  body { font-family:'Figtree', sans-serif; color:#fff; position:relative; -webkit-font-smoothing:antialiased; }
  .bg { position:absolute; inset:0;
    background:
      radial-gradient(820px 700px at 88% 22%, rgba(123,92,255,.42), transparent 64%),
      radial-gradient(820px 700px at 8% 84%, rgba(239,79,36,.30), transparent 64%),
      linear-gradient(180deg, #0B0B2C 0%, #0A0A26 100%); }
  .grain { position:absolute; inset:0; background:url('../assets/img/grain.png'); opacity:.05; mix-blend-mode:overlay; }

  .t { position:absolute; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:34px; font:900 214px/1 'Figtree'; letter-spacing:-.05em; }
  .t1 { top:566px; }
  .t2 { top:850px; }
  .bubble { background:#fff; color:#0E0142; border-radius:64px 64px 64px 16px; padding:4px 56px 30px; transform:rotate(-4deg); box-shadow:0 30px 70px rgba(0,0,0,.4); }
  .pill { background:linear-gradient(135deg,#22C77A,#12894F); border-radius:52px; padding:4px 54px 30px 50px; transform:rotate(3deg); box-shadow:0 30px 70px rgba(24,178,107,.35); }

  .sub { position:absolute; top:1164px; left:0; right:0; text-align:center; font:600 48px 'Figtree'; color:var(--sub); letter-spacing:-.005em; }

  .marcas { position:absolute; top:1338px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:34px; }
  .cg { display:flex; align-items:center; gap:16px; }
  .cg svg { width:104px; height:auto; }
  .cg .wm { font:300 30px/1 Raleway; letter-spacing:.1em; white-space:nowrap; }
  .cg .wm b { font-weight:700; color:var(--laranja); }
  .sep { width:2px; height:56px; background:rgba(255,255,255,.25); }
  .kommo { display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
  .kommo img { width:150px; filter:brightness(0) invert(1); }
  .kommo span { font:500 22px/1 'Raleway'; letter-spacing:.24em; color:rgba(255,255,255,.7); padding-left:3px; }

  .safe { position:absolute; left:0; right:0; border-top:3px dashed rgba(255,61,96,.9); display:none; }
  body.guias .safe { display:block; }
</style>
</head>
<body>
<div class="bg"></div><div class="grain"></div>

<div class="t t1"><span>Do</span><div class="bubble">oi</div></div>
<div class="t t2"><span>ao</span><div class="pill">pago.</div></div>

<div class="sub">IA no Kommo, de ponta a ponta.</div>

<div class="marcas">
  <div class="cg"><svg id="cg" viewBox="0 0 1330 708"></svg><div class="wm">CONTROL <b>GESTÃO</b></div></div>
  <div class="sep"></div>
  <div class="kommo"><img src="../assets/img/kommo-logo.png"><span>PARTNER</span></div>
</div>

<div class="safe" style="top:240px"></div><div class="safe" style="top:1680px"></div>
<div class="safe" style="top:420px;border-color:rgba(63,208,255,.9)"></div><div class="safe" style="top:1500px;border-color:rgba(63,208,255,.9)"></div>

<script src="../js/cg-paths.js"></script>
<script>
  const P = window.CG_PATHS;
  document.getElementById('cg').innerHTML = `<path fill="#fff" fill-rule="evenodd" d="${P.C}"/><path fill="#fff" fill-rule="evenodd" d="${P.Gtop}"/><path fill="#fff" fill-rule="evenodd" d="${P.Gbot}"/><path fill="#EF4F24" fill-rule="evenodd" d="${P.lens}"/>`;
  if (new URLSearchParams(location.search).has('guias')) document.body.classList.add('guias');
  window.__ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))));
</script>
</body>
</html>
